# .goreleaser.yml - Aether Release Pipeline Configuration
# Requires: goreleaser v2.x
# Triggers on: git tag push matching 'v*'

version: 2

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: aether
    main: ./cmd/aether
    binary: aether
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: darwin
        goarch: arm64
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/Debajyoti0-0/aether/internal/version.Version={{.Version}}
      - -X github.com/Debajyoti0-0/aether/internal/version.Commit={{.Commit}}
    flags:
      - -trimpath
    hooks:
      post:
        - ./scripts/sign-windows.sh {{ .Path }}  # Windows Authenticode signing

archives:
  - id: aether-archives
    builds:
      - aether
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

signs:
  - id: cosign-sign
    artifacts: all
    cmd: cosign sign-blob --yes --output-signature {{.Artifact}}.sig --output-certificate {{.Artifact}}.pem {{.Artifact}}
    stdin: "{{ .Env.COSIGN_KEY }}"

  - id: cosign-sign-manifest
    artifacts: checksums.txt
    cmd: cosign sign-blob --yes --output-signature checksums.txt.sig --output-certificate checksums.txt.pem checksums.txt
    stdin: "{{ .Env.COSIGN_KEY }}"

  - id: cosign-sign-sbom
    artifacts: sbom-cyclonedx.json
    cmd: cosign sign-blob --yes --output-signature sbom-cyclonedx.json.sig --output-certificate sbom-cyclonedx.json.pem sbom-cyclonedx.json
    stdin: "{{ .Env.COSIGN_KEY }}"

  - id: cosign-sign-manifest-file
    artifacts: release-manifest.json
    cmd: cosign sign-blob --yes --output-signature release-manifest.json.sig --output-certificate release-manifest.json.pem release-manifest.json
    stdin: "{{ .Env.COSIGN_KEY }}"

sbom:
  - id: syft-sbom
    artifacts: all
    cmd: syft {{ .Path }} -o cyclonedx-json={{ .Path }}.sbom.json

provenance:
  builder: goreleaser
  type: slsa
  documents:
    - type: attestation
      name: provenance
      path: provenance.json

release:
  draft: false
  prerelease: auto
  header: |
    # Aether {{ .Version }}

    {{- if .IsPrerelease }}
    **⚠️ Pre-release build — not recommended for production use.**
    {{- end }}

  footer: |
    ---

    ## Verification

    ### Linux/macOS (cosign)
    ```bash
    cosign verify-blob --signature aether_{{ .Version }}_{{ .Os }}_{{ .Arch }}.sig \\
      --certificate aether_{{ .Version }}_{{ .Os }}_{{ .Arch }}.pem \\
      --certificate-identity-regexp ".*" \\
      --certificate-oidc-issuer-regexp ".*" \\
      aether_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    ```

    ### Windows (Authenticode)
    ```cmd
    signtool verify /pa /v aether_{{ .Version }}_windows_amd64.exe
    ```

    ### All Artifacts
    ```bash
    sha256sum -c checksums.txt
    ```

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

snapshot:
  name_template: "{{ .Version }}-next"

release:
  github:
    owner: Debajyoti0-0
    name: aether
  draft: false
  prerelease: auto

nfpms: []

release:
  github:
    owner: Debajyoti0-0
    name: aether

env:
  - GOFLAGS=-mod=readonly

# Disable Docker builds (not needed for Aether)
dockers: []