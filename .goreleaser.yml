# .goreleaser.yml - Aether Release Pipeline Configuration
# Requires: goreleaser v2.x
# Triggers on: git tag push matching 'v*'

version: 2

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: aether
    main: ./cmd/aether
    binary: aether
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/Debajyoti0-0/aether/internal/version.Version={{.Version}}
      - -X github.com/Debajyoti0-0/aether/internal/version.Commit={{.Commit}}
    flags:
      - -trimpath

archives:
  - id: aether-archives
    ids:
      - aether
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

sboms:
  - artifacts: archive

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: Debajyoti0-0
    name: aether
  draft: false
  prerelease: auto
  header: |
    # Aether {{ .Version }}

    {{- if .IsPrerelease }}
    **⚠️ Pre-release build — not recommended for production use.**
    {{- end }}

  footer: |
    ---

    ## Verification

    Note: cryptographic signatures are NOT currently produced by
    this pipeline (no `signs:` configuration; finding F-30-2).
    Cosign/Authenticode instructions will be restored only when
    the pipeline actually emits signatures.

    ### All Artifacts
    ```bash
    sha256sum -c checksums.txt
    ```

snapshot:
  version_template: "{{ .Tag }}-next"

nfpms: []

env:
  - GOFLAGS=-mod=readonly

# Disable Docker builds (not needed for Aether)
dockers: []