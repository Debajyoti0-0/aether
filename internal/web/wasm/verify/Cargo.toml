[package]
name = "aether-verify"
version = "1.0.0"
edition = "2021"
description = "Client-side Ed25519 audit-chain verifier for the Aether dashboard"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = { version = "2", default-features = false, features = ["alloc", "fast"] }
base64 = "0.22"
hex = "0.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
