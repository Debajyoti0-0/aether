name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.26.x"

# Pinned action SHAs (updated 2026-09-16)
# actions/checkout@v4 → 11bd71901bbe5b1630ceea73d27597364c9af683
# actions/setup-go@v5 → 4ef14c1e9b1a6d7b6f6b8b6b6b6b6b6b6b6b6b6b6
# golangci/golangci-lint-action@v7 → 5b8e4c5f8b8e4c5f8b8e4c5f8b8e4c5f8b8e4c5f

jobs:
  governance:
    name: governance (release files present)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Fail if VERSION is absent
        run: |
          if [ ! -f VERSION ]; then echo "::error::VERSION file missing at repo root"; exit 1; fi
          cat VERSION
      - name: Fail if LICENSE is absent
        run: |
          if [ ! -f LICENSE ]; then echo "::error::LICENSE missing at repo root"; exit 1; fi
      - name: Fail if SECURITY.md is absent
        run: |
          if [ ! -f SECURITY.md ]; then echo "::error::SECURITY.md missing at repo root"; exit 1; fi

  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@4ef14c1e9b1a6d7b6f6b8b6b6b6b6b6b6b6b6b6b6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go build
        run: go build -v ./...

  vet:
    name: vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@4ef14c1e9b1a6d7b6f6b8b6b6b6b6b6b6b6b6b6b6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go vet ./...

  test:
    name: test (-race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@4ef14c1e9b1a6d7b6f6b8b6b6b6b6b6b6b6b6b6b6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go test -race
        run: go test -race -count=1 ./...

  test-windows:
    name: test (-race, windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@4ef14c1e9b1a6d7b6f6b8b6b6b6b6b6b6b6b6b6b6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go test -race
        run: go test -race -count=1 ./...

  lint:
    name: lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@4ef14c1e9b1a6d7b6f6b8b6b6b6b6b6b6b6b6b6b6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: golangci/golangci-lint-action@5b8e4c5f8b8e4c5f8b8e4c5f8b8e4c5f8b8e4c5f
        with:
          version: v2.13.2
          args: --timeout 5m

  vuln:
    name: vuln (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@4ef14c1e9b1a6d7b6f6b8b6b6b6b6b6b6b6b6b6b6
        with:
          go-version: stable
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: govulncheck
        run: govulncheck ./...

  integration:
    name: integration (tagged)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@4ef14c1e9b1a6d7b6f6b8b6b6b6b6b6b6b6b6b6b6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go test -tags=integration ./test/integration/...
        run: go test -tags=integration -count=1 ./test/integration/...