version: "2"

run:
  timeout: 10m

linters:
  default: none
  enable:
    # Correctness linters measured at zero findings on this codebase. These
    # were adopted in Stage 53V after Response A was measured, not assumed.
    - govet
    - ineffassign
    - misspell
    # Deliberately NOT enabled. Each is measured and deferred with an owner
    # rather than silently omitted. See docs/stage53v-linter-scope.md for the
    # full measured counts, the rationale, and the risk accepted.
    #   errcheck    300
    #   gosec       240
    #   staticcheck  41
    #   errorlint    34
    #   unused       27
    #   prealloc     13
    #   bodyclose     7
    #   nilerr        3
    #   unconvert     2
    #   copyloopvar   1

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
